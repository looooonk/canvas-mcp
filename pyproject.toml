[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Local, strictly read-only Canvas LMS MCP server for Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6,<7",
]

[project.scripts]
canvas-mcp = "canvas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
